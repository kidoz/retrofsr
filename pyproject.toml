[project]
name = "retrofsr-tools"
version = "0.6.0"
description = "Development and image-quality tools for the retrofsr C++ library"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
benchmark = [
    "numpy>=2.3,<3",
    "scipy>=1.16,<2",
]
dev = [
    "mypy>=1.19,<3",
    "ruff>=0.14,<1",
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["tools", "tests/tools"]
exclude = ["^build", "^subprojects/", "^\\.agents/"]

[tool.ruff]
target-version = "py314"
line-length = 110
include = ["tools/**/*.py", "tests/tools/**/*.py", "pyproject.toml"]
extend-exclude = [".agents", "subprojects", "build*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
